services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sehir_nabiz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sehir_nabiz}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_dev_password}
    ports:
      # Port çakışmalarını önlemek için 5434 host portu kullanılmıştır (127.0.0.1)
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sehir_nabiz}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sehir_nabiz_network

  redis:
    image: redis:7-alpine
    container_name: sehir_nabiz_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_dev_secret}"]
    ports:
      # Port çakışmalarını önlemek için 6380 host portu kullanılmıştır (127.0.0.1)
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sehir_nabiz_network

  minio:
    image: elestio/minio:latest
    container_name: sehir_nabiz_minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minio_admin_user}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minio_secure_dev_password}
    ports:
      # S3 API portu (127.0.0.1:9000)
      - "127.0.0.1:${STORAGE_PORT:-9000}:9000"
      # MinIO Web Konsol portu (127.0.0.1:9001)
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sehir_nabiz_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  sehir_nabiz_network:
    driver: bridge
